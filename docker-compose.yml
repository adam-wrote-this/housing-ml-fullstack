services:
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: housing-ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATASET_PATH=/app/shared/housing.csv
    volumes:
      - "./docs/House Price Dataset.csv:/app/shared/housing.csv:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app1-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: housing-app1-python
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  app2-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: housing-app2-java
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - DATASET_PATH=/app/shared/housing.csv
      - CACHE_MAXIMUM_SIZE=1000
      - CACHE_EXPIRE_AFTER_WRITE=15m
    volumes:
      - "./docs/House Price Dataset.csv:/app/shared/housing.csv:ro"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./nextjs-portal
      dockerfile: Dockerfile
    container_name: housing-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PYTHON_BACKEND_URL=http://app1-python:8001
      - JAVA_BACKEND_URL=http://app2-java:8080
    volumes:
      - ./nextjs-portal:/app
      - /app/node_modules
    depends_on:
      app1-python:
        condition: service_healthy
      app2-java:
        condition: service_healthy
